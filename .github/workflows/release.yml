name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact aligned package version, for example 0.1.0
        required: true
        type: string
      publish_github:
        description: Create the Git tag and GitHub Release from main
        required: true
        default: false
        type: boolean
      publish_npm:
        description: Publish @fuzzy-parser/node from main
        required: true
        default: false
        type: boolean
      publish_container:
        description: Publish the batch CLI image to GHCR from main
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: '1.96.0'
  NODE_VERSION: '22'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate ${{ inputs.version }} and repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, 2026-08-05
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Require aligned versions and main for publication
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_PUBLISH_REQUESTED: ${{ inputs.publish_github || inputs.publish_npm || inputs.publish_container }}
        run: node tools/release/check-version.mjs "$RELEASE_VERSION"
      - name: Run the deterministic release baseline
        run: tools/ci/verify-local.sh quick

  cli:
    name: CLI ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, 2026-08-05
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Build and archive parser-cli
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_LABEL: ${{ matrix.label }}
        run: |
          cargo build --release --locked -p parser-cli --target "$RELEASE_TARGET"
          stage="$RUNNER_TEMP/fuzzy-parser-$RELEASE_VERSION-$RELEASE_LABEL"
          mkdir -p "$stage"
          cp "target/$RELEASE_TARGET/release/parser-cli" "$stage/"
          cp LICENSE README.md "$stage/"
          archive="$RUNNER_TEMP/fuzzy-parser-$RELEASE_VERSION-$RELEASE_LABEL.tar.gz"
          tar -C "$stage" -czf "$archive" .
          tools/release/write-checksum.sh "$archive"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/fuzzy-parser-${{ inputs.version }}-${{ matrix.label }}.tar.gz
            ${{ runner.temp }}/fuzzy-parser-${{ inputs.version }}-${{ matrix.label }}.tar.gz.sha256
          if-no-files-found: error

  node-package:
    name: Node/WASM package
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, 2026-08-05
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Build, test, install, and pack
        run: |
          node tools/ci/verify-node-package.mjs
          archive_name="$(cd packages/fuzzy-parser-node && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -1)"
          test -f "$RUNNER_TEMP/$archive_name"
          tools/release/write-checksum.sh "$RUNNER_TEMP/$archive_name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-package
          path: |
            ${{ runner.temp }}/fuzzy-parser-node-${{ inputs.version }}.tgz
            ${{ runner.temp }}/fuzzy-parser-node-${{ inputs.version }}.tgz.sha256
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    if: ${{ inputs.publish_github == true }}
    needs: [validate, cli, node-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create immutable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fuzzy Parser v$RELEASE_VERSION" \
            --generate-notes

  npm:
    name: Publish npm package
    if: ${{ inputs.publish_npm == true }}
    needs: [validate, node-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-package
          path: node-package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Publish the already-verified tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish node-package/fuzzy-parser-node-${{ inputs.version }}.tgz --access public --provenance

  container:
    name: Publish batch CLI image
    if: ${{ inputs.publish_container == true }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image tags
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/2001j/fuzzy-parser:${{ inputs.version }}
            ghcr.io/2001j/fuzzy-parser:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}
