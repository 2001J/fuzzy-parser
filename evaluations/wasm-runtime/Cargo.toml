[package]
name = "fuzzy-parser-wasm-evaluation"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "native-byte-oracle"
path = "src/oracle.rs"

[dependencies]
parser-core = { path = "../../crates/parser-core" }
parser-formats = { path = "../../crates/parser-formats" }
parser-schema = { path = "../../crates/parser-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.115"

[workspace]
